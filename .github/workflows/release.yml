name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: release-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'plugins/*/package.json', 'packages/*/package.json') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --no-save
      - run: bun run release:ci --publish
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
      - name: Notify release result
        if: always()
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          bun tooling/release-notify.ts release-notification.md
          cat release-notification.md >> "$GITHUB_STEP_SUMMARY"

          pr_number="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].number // empty' || true)"
          if [ -n "$pr_number" ]; then
            gh pr comment "$pr_number" --body-file release-notification.md
          fi
